<section class="page" data-page="claude-chat" data-title="Claude Chat Workflow | Exam Paper Variation CPD">
  <div class="shell workflow-page">
    <div class="workflow-hero">
      <div>
        <p class="eyebrow">Workflow A</p>
        <h1>Claude Chat Workflow</h1>
      </div>
    </div>
    <div class="content-grid">
      <section class="page-panel" aria-labelledby="claude-chat-checklist-title">
        <h2 id="claude-chat-checklist-title">Checklist</h2>
        <ol class="checklist">
          <li><input id="check-claude-chat-4" type="checkbox"><label for="check-claude-chat-4">Open Claude and start a new chat. Sign up if needed.</label></li>
          <li>
            <input id="check-claude-chat-5" type="checkbox">
            <span class="checklist-content">
              <label for="check-claude-chat-5">Download <strong>exam-variation.skill</strong> from this page.</label>
              <a class="inline-help-button" href="../exam-variation.skill" download>Download</a>
            </span>
          </li>
          <li>
            <input id="check-claude-chat-6" type="checkbox">
            <span class="checklist-content">
              <label for="check-claude-chat-6">Go to Claude sidebar &gt; Customise &gt; Skills &gt; Upload, then upload the skill.</label>
              <button class="inline-help-button" type="button" data-open-modal="instructions-modal">Show screenshot</button>
            </span>
          </li>
          <li><input id="check-claude-chat-1" type="checkbox"><label for="check-claude-chat-1">Choose an exam question from your resource bank.</label></li>
          <li><input id="check-claude-chat-2" type="checkbox"><label for="check-claude-chat-2">Screenshot the question.</label></li>
          <li><input id="check-claude-chat-3" type="checkbox"><label for="check-claude-chat-3">Screenshot the mark scheme.</label></li>
          <li><input id="check-claude-chat-7" type="checkbox"><label for="check-claude-chat-7">Open a new chat, add the question paper and mark scheme screenshots, and ask Claude to variate the questions.</label></li>
        </ol>
      </section>

      <div class="page-stack">
        <section class="page-panel" aria-labelledby="claude-chat-skill-title">
          <h2 id="claude-chat-skill-title">Claude skill</h2>
          <div class="skill-card">
            <div>
              <strong>exam-variation.skill</strong>
            </div>
            <div class="skill-actions">
              <a class="button button-primary" href="../exam-variation.skill" download>Download skill</a>
              <button class="button" type="button" data-open-modal="skill-modal" data-load-skill-file="../skills/exam-variation/SKILL.md">Inspect files</button>
            </div>
          </div>
        </section>

        <section class="page-panel" aria-labelledby="claude-chat-prompt-title">
          <h2 id="claude-chat-prompt-title">Prompt guide</h2>
          <div class="prompt-box">
            <div class="prompt-toolbar">
              <div>
                <div class="prompt-label">Guide prompt</div>
                <strong>Claude Chat Workflow</strong>
              </div>
              <button class="copy-button" type="button" data-copy-prompt>Copy prompt</button>
            </div>
            <textarea readonly spellcheck="false">Use the exam skill to variate this question.

Keep the topic/ subject matter as close to the original as possible.

Only change contextual keywords, data values, names, examples, diagrams, scenarios, or surface details where a fresh version is needed.

The goal is to iterate a new question of the same subject matter. We will begin by changing the trivial content and then move on to more complex variations.

</textarea>
          </div>
        </section>
      </div>
    </div>

    <nav class="pager" aria-label="Claude Chat Workflow navigation">
      <a class="button" href="#home">Back to choose</a>
      <a class="button button-primary" href="#power-user">Next: B</a>
    </nav>
  </div>

  <div class="modal-backdrop" id="instructions-modal" role="dialog" aria-modal="true" aria-labelledby="instructions-modal-title" hidden>
    <div class="modal-panel">
      <div class="modal-toolbar">
        <h2 id="instructions-modal-title">Skill upload screenshot</h2>
        <button class="modal-close" type="button" data-close-modal aria-label="Close screenshot">Close</button>
      </div>
      <img class="modal-image" src="instructions.png" alt="Claude settings screen showing where to upload a skill.">
    </div>
  </div>

  <div class="modal-backdrop" id="skill-modal" role="dialog" aria-modal="true" aria-labelledby="skill-modal-title" hidden>
    <div class="modal-panel modal-panel-wide">
      <div class="modal-toolbar">
        <h2 id="skill-modal-title">Exam variation skill files</h2>
        <button class="modal-close" type="button" data-close-modal aria-label="Close skill file viewer">Close</button>
      </div>
      <div class="skill-viewer">
        <div class="skill-file-list" aria-label="Skill files">
          <button type="button" data-skill-file="../skills/exam-variation/SKILL.md">SKILL.md</button>
          <button type="button" data-skill-file="../skills/exam-variation/assets/html-exemplars.md">assets/html-exemplars.md</button>
          <button type="button" data-skill-file="../skills/exam-variation/assets/exemplar-question-paper.html">assets/exemplar-question-paper.html</button>
          <button type="button" data-skill-file="../skills/exam-variation/assets/exemplar-mark-scheme.html">assets/exemplar-mark-scheme.html</button>
          <button type="button" data-skill-file="../skills/exam-variation/assets/exemplar-quality-assurance-notes.html">assets/exemplar-quality-assurance-notes.html</button>
        </div>
        <div class="skill-file-preview markdown-preview" data-skill-content tabindex="0">Select a file to inspect.</div>
      </div>
    </div>
  </div>
</section>
